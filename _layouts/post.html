<!doctype html>
<html lang="en">
  {% include head.html %}
  <body>
    {% include header.html %}
    <main class="post-main">
      <article class="post-article container reveal">
        <p class="eyebrow">Blog</p>
        <h1>{{ page.title }}</h1>
        <p class="post-meta">{{ page.date | date: "%Y.%m.%d" }} · {{ page.reading_time | default: "3 min read" }}</p>
        <div class="post-body">
          {{ content }}
        </div>
      </article>
    </main>
    <footer class="site-footer">
      <div class="container footer-content">
        <p>© <span id="year"></span> {{ site.title }}. Built with GitHub Pages.</p>
        <a href="{{ '/blog/' | relative_url }}">Back to Blog</a>
      </div>
    </footer>
    <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
  </body>
</html>
